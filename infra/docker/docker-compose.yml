version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dira
      POSTGRES_USER: dira
      POSTGRES_PASSWORD: ${DIRA_DB_PASSWORD:-dira_dev_password_change_me}
    volumes:
      - dira_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dira -d dira"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dira-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dira_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dira_postgres_data:
  dira_redis_data:
